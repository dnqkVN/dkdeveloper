<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chuyển hướng link utl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&family=SF+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- 1. THÊM SDK FIREBASE VÀO ĐÂY -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --bg: #000000;
    --bg-gradient: linear-gradient(135deg, #000000 0%, #1a1a2e 50%, #16213e 100%);
    --surface-1: #1c1c1e;
    --surface-2: #2c2c2e;
    --surface-3: #3a3a3c;
    --surface-glass: rgba(28, 28, 30, 0.4);
    --accent: #00d4ff;
    --accent-glow: rgba(0, 212, 255, 0.3);
    --accent-green: #30d158;
    --accent-red: #ff453a;
    --accent-orange: #ff9f0a;
    --text-primary: #ffffff;
    --text-secondary: #b0b0b3;
    --text-tertiary: #6e6e73;
    --separator: rgba(255,255,255,0.08);
    --blur-bg: rgba(28,28,30,0.25);
    --font: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    --font-mono: 'SF Mono', 'Fira Code', monospace;
    --tab-height: 83px;
    --radius-lg: 20px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --glow: 0 0 20px rgba(0, 212, 255, 0.4);
  }

  html, body {
    height: 100%;
    background: var(--bg-gradient);
    color: var(--text-primary);
    font-family: var(--font);
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
    position: relative;
    background: radial-gradient(circle at 20% 80%, rgba(0,212,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(48,209,88,0.1) 0%, transparent 50%),
                var(--bg-gradient);
  }

  .screen {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    padding-bottom: calc(var(--tab-height) + 16px);
    scrollbar-width: none;
    display: none;
  }
  .screen::-webkit-scrollbar { display: none; }
  .screen.active { display: block; animation: fadeInUp 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .header {
    padding: 56px 20px 12px;
    background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  /* Style cho ô nhập & nút lưu */
  .card-box {
    background: var(--surface-glass);
    border: 1px solid var(--separator);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 16px;
    backdrop-filter: blur(10px);
  }

  .custom-input {
    width: 100%;
    padding: 12px 14px;
    background: var(--surface-2);
    border: 1px solid var(--surface-3);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 14px;
    margin-bottom: 10px;
    outline: none;
  }

  .custom-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #000;
    font-weight: 600;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    box-shadow: var(--glow);
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="header-top">
      <h1 style="font-size: 24px; font-weight: 700;">Chuyển hướng link utl</h1>
    </div>
  </div>

  <!-- Screen Active giữ nguyên cấu trúc gốc của cậu -->
  <div class="screen active">
    
    <!-- Khung Lưu Link Riêng Lẻ -->
    <div class="card-box">
      <h3 style="font-size: 15px; margin-bottom: 10px; color: var(--accent);">Lưu Link Riêng Lẻ</h3>
      <input type="text" id="singleTitle" class="custom-input" placeholder="Tên gợi nhớ (VD: Link FB...)">
      <input type="url" id="singleUrl" class="custom-input" placeholder="Dán URL vào đây (https://...)">
      <button class="custom-btn" id="btnSaveSingle">Lưu Lên Firebase</button>
    </div>

    <!-- Nơi render danh sách link đã lưu -->
    <div class="card-box">
      <h3 style="font-size: 15px; margin-bottom: 10px;">Danh Sách Link</h3>
      <div id="linkList">Chưa có dữ liệu...</div>
    </div>

  </div>
</div>

<!-- 2. SCRIPT KẾT NỐI & XỬ LÝ FIREBASE -->
<script>
  // Điền đúng thông tin Firebase của cậu vào đây nha
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.database();

  // Bắt sự kiện Click nút Lưu Link Riêng Lẻ
  document.getElementById('btnSaveSingle').addEventListener('click', function() {
    const title = document.getElementById('singleTitle').value.trim();
    const url = document.getElementById('singleUrl').value.trim();

    if (!url) {
      alert('Cậu chưa nhập URL kìa!');
      return;
    }

    // Đẩy dữ liệu lên node 'user_links' trên Firebase
    db.ref('user_links').push({
      title: title || 'Link không tên',
      url: url,
      createdAt: firebase.database.ServerValue.TIMESTAMP
    }).then(() => {
      alert('Lưu link thành công rồi nha!');
      document.getElementById('singleTitle').value = '';
      document.getElementById('singleUrl').value = '';
    }).catch((err) => {
      alert('Lỗi rồi: ' + err.message);
      console.error(err);
    });
  });

  // Tự động tải danh sách link realtime
  db.ref('user_links').on('value', (snapshot) => {
    const listDiv = document.getElementById('linkList');
    listDiv.innerHTML = '';

    if (!snapshot.exists()) {
      listDiv.innerHTML = '<span style="color:var(--text-tertiary); font-size:13px;">Chưa lưu link nào!</span>';
      return;
    }

    snapshot.forEach((child) => {
      const item = child.val();
      listDiv.innerHTML += `
        <div style="padding: 10px 0; border-bottom: 1px solid var(--separator);">
          <div style="font-weight:600; font-size:14px;">${item.title}</div>
          <a href="${item.url}" target="_blank" style="color:var(--accent); font-size:12px; word-break:break-all;">${item.url}</a>
        </div>
      `;
    });
  });
</script>

</body>
</html>
