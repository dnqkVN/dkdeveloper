<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chuyển hướng link utl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&family=SF+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- SDK Firebase (Bắt buộc phải có) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --bg: #000000;
    --bg-gradient: linear-gradient(135deg, #000000 0%, #1a1a2e 50%, #16213e 100%);
    --surface-1: #1c1c1e;
    --surface-2: #2c2c2e;
    --surface-3: #3a3a3c;
    --surface-glass: rgba(28, 28, 30, 0.4);
    --accent: #00d4ff;
    --accent-glow: rgba(0, 212, 255, 0.3);
    --accent-green: #30d158;
    --accent-red: #ff453a;
    --accent-orange: #ff9f0a;
    --text-primary: #ffffff;
    --text-secondary: #b0b0b3;
    --text-tertiary: #6e6e73;
    --separator: rgba(255,255,255,0.08);
    --blur-bg: rgba(28,28,30,0.25);
    --font: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    --font-mono: 'SF Mono', 'Fira Code', monospace;
    --tab-height: 83px;
    --radius-lg: 20px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --glow: 0 0 20px rgba(0, 212, 255, 0.4);
  }

  html, body {
    height: 100%;
    background: var(--bg-gradient);
    color: var(--text-primary);
    font-family: var(--font);
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
    position: relative;
    background: radial-gradient(circle at 20% 80%, rgba(0,212,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(48,209,88,0.1) 0%, transparent 50%),
                var(--bg-gradient);
  }

  .header {
    padding: 40px 20px 16px;
    background: rgba(0, 0, 0, 0.6);
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--separator);
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(90deg, #fff, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .screen {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: block;
  }

  .card {
    background: var(--surface-glass);
    border: 1px solid var(--separator);
    border-radius: var(--radius-lg);
    padding: 20px;
    backdrop-filter: blur(10px);
    margin-bottom: 20px;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 15px;
  }

  input[type="text"], input[type="url"] {
    width: 100%;
    padding: 14px 16px;
    background: var(--surface-2);
    border: 1px solid var(--surface-3);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    font-size: 15px;
    outline: none;
    transition: all 0.3s ease;
  }

  input:focus {
    border-color: var(--accent);
    box-shadow: var(--glow);
  }

  .btn {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #000;
    font-weight: 600;
    font-size: 15px;
    border: none;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
  }

  .btn:active {
    transform: scale(0.98);
    opacity: 0.9;
  }

  .link-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link-item {
    background: var(--surface-1);
    border: 1px solid var(--separator);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .link-info {
    overflow: hidden;
    padding-right: 10px;
  }

  .link-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  .link-url {
    font-size: 13px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .status-tag {
    font-size: 12px;
    color: var(--accent-green);
    background: rgba(48, 209, 88, 0.15);
    padding: 4px 8px;
    border-radius: 6px;
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="header-top">
      <h1>Chuyển Hướng Link</h1>
      <span class="status-tag" id="statusTag">Đang kết nối...</span>
    </div>
  </div>

  <div class="screen">
    <!-- Form Lưu Link Riêng Lẻ -->
    <div class="card">
      <h2 style="font-size: 16px; font-weight: 600;">Lưu Link Riêng Lẻ</h2>
      <div class="input-group">
        <input type="text" id="linkTitle" placeholder="Tên gợi nhớ (VD: Link FB, Web Phim...)">
        <input type="url" id="linkUrl" placeholder="Nhập đường dẫn URL (https://...)">
        <button class="btn" id="btnSaveSingle">Lưu Link Lên Firebase</button>
      </div>
    </div>

    <!-- Danh sách link đã lưu từ Firebase -->
    <div class="card">
      <h2 style="font-size: 16px; font-weight: 600; margin-bottom: 12px;">Danh Sách Link Đã Lưu</h2>
      <div class="link-list" id="linkContainer">
        <div style="color: var(--text-tertiary); font-size: 14px; text-align: center;">Chưa có dữ liệu...</div>
      </div>
    </div>
  </div>
</div>

<script>
  // 1. CHẤU ĐỔI CẤU HÌNH FIREBASE CỦA CẬU VÀO ĐÂY NHA:
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  // Khởi tạo Firebase
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const database = firebase.database();

  // Kiểm tra trạng thái kết nối
  database.ref(".info/connected").on("value", function(snap) {
    const statusTag = document.getElementById("statusTag");
    if (snap.val() === true) {
      statusTag.innerText = "Online";
      statusTag.style.color = "var(--accent-green)";
    } else {
      statusTag.innerText = "Offline";
      statusTag.style.color = "var(--accent-red)";
    }
  });

  // 2. XỬ LÝ SỰ KIỆN NÚT LƯU LINK RIÊNG LẺ
  document.getElementById('btnSaveSingle').addEventListener('click', function() {
    const titleInput = document.getElementById('linkTitle').value.trim();
    const urlInput = document.getElementById('linkUrl').value.trim();

    if (!urlInput) {
      alert('Cậu ơi, vui lòng nhập link URL nhé!');
      return;
    }

    // Đổi tên nút để báo trạng thái đang xử lý
    const btn = document.getElementById('btnSaveSingle');
    btn.innerText = "Đang lưu...";
    btn.disabled = true;

    // Đẩy dữ liệu lên node 'links' trong Realtime Database
    const newLinkRef = database.ref('links').push();
    newLinkRef.set({
      title: titleInput || 'Link không tên',
      url: urlInput,
      timestamp: firebase.database.ServerValue.TIMESTAMP
    }).then(() => {
      alert('Lưu link thành công!');
      document.getElementById('linkTitle').value = '';
      document.getElementById('linkUrl').value = '';
    }).catch((error) => {
      console.error("Lỗi Firebase:", error);
      alert('Không lưu được link: ' + error.message);
    }).finally(() => {
      btn.innerText = "Lưu Link Lên Firebase";
      btn.disabled = false;
    });
  });

  // 3. LẮNG NGHE VÀ HIỂN THỊ DANH SÁCH LINK THỜI GIAN THỰC (REALTIME)
  database.ref('links').on('value', (snapshot) => {
    const container = document.getElementById('linkContainer');
    container.innerHTML = '';

    if (!snapshot.exists()) {
      container.innerHTML = '<div style="color: var(--text-tertiary); font-size: 14px; text-align: center;">Chưa có link nào được lưu!</div>';
      return;
    }

    snapshot.forEach((childSnapshot) => {
      const data = childSnapshot.val();
      const itemHtml = `
        <div class="link-item">
          <div class="link-info">
            <div class="link-title">${escapeHtml(data.title)}</div>
            <div class="link-url">${escapeHtml(data.url)}</div>
          </div>
          <a href="${escapeHtml(data.url)}" target="_blank" class="status-tag" style="text-decoration: none; color: var(--accent);">Mở</a>
        </div>
      `;
      container.insertAdjacentHTML('afterbegin', itemHtml);
    });
  });

  // Hàm chống xss nhẹ khi render dữ liệu
  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
